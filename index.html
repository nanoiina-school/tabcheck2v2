function diag(r,t){const u=API_URL;
  if(/PASTE_WEB_APP/.test(u))return"ยังไม่ได้ใส่ API_URL ในไฟล์ index.html (ยังเป็นค่าตัวอย่าง)";

  if(/Page Not Found|ไม่พบหน้า|404/i.test(t))return"ไม่พบ Web App ตาม URL นี้ — คัดลอกลิงก์ /exec ใหม่จากหน้า Deploy";
  return"ได้รับหน้า HTML แทน JSON (HTTP "+r.status+"): "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160)}

async function start(u){S.me=u;await Promise.all(["users","students","checks"].map(c=>new Promise(r=>{let f=0;db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({id:d.id,...d.data()}));if(!f){f=1;r()}else after()},()=>{if(!f){f=1;r()}})})));S.me=S.users.find(x=>x.id===u.id)||u}

  <header class="topbar flex items-center gap-3 px-4 py-3"><button class="btn lg:hidden" onclick="S.drawer=true;render()" aria-label="เมนู">${ic("menu")}</button><h1 class="font-bold text-lg flex-1">${cur[1]}</h1><span class="tag ${isAdmin()?"t-adm":"t-info"}">${ic(isAdmin()?"shield_person":"person")}${esc(S.me.name)}${isAdmin()?"":" · "+esc(S.me.room)}</span></header>

  <div class="grid gap-3">${none?'<div><label class="lb">ชื่อ-สกุล</label><input class="inp" id="ln"></div>':""}<div><label class="lb">ชื่อผู้ใช้</label><input class="inp" id="lu" autocomplete="username"></div><div><label class="lb">รหัสผ่าน</label><input class="inp" id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')${none?"setup()":"login()"}"></div>

function hist(sid){const st=S.students.find(x=>x.id===sid),l=S.checks.filter(c=>c.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date));
  modal("ประวัติการตรวจ — "+esc(st?.name),l.length?`<div class="tw"><table><tr><th>วันที่</th><th>สถานะ</th><th></th></tr>${l.map(c=>`<tr><td>${thd(c.date)}</td><td>${tag(c)}</td><td><button class="btn btn-s btn-p" onclick="editC('${sid}','${c.date}')">${ic("edit")}แก้ไข</button></td></tr>`).join("")}</table></div>`:'<p class="mu">ยังไม่เคยตรวจ</p>',null)}
function editC(sid,date){closeM();S.date=date;S.view="check";S.drawer=false;pick(sid)}

/* ---------- summary & charts ---------- */
const TM=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"],thm=m=>TM[+m.slice(5)-1]+" "+(+m.slice(0,4)+543);
function sumData(){const room=myRoom(),L=S.students.filter(s=>s.room===room).sort(srt),cs=S.checks.filter(c=>c.room===room),months=[...new Set(cs.map(c=>c.date.slice(0,7)))].sort();
  if(!S.month||!months.includes(S.month))S.month=months[months.length-1]||today().slice(0,7);
  const inM=cs.filter(c=>c.date.slice(0,7)===S.month),dates=[...new Set(inM.map(c=>c.date))].sort();
  if(S.sdate!=="ALL"&&!dates.includes(S.sdate))S.sdate="ALL";
  const latest=(l,sid)=>l.filter(c=>c.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const rows=L.map(s=>({s,c:S.sdate==="ALL"?latest(inM,s.id):chk(s.id,S.sdate)})),dn=rows.filter(r=>r.c),bad=dn.filter(r=>isBad(r.c)).length;
  const byM=months.map(m=>{const x=cs.filter(c=>c.date.slice(0,7)===m),l=L.map(s=>latest(x,s.id)).filter(Boolean);return[l.filter(c=>!isBad(c)).length,l.filter(isBad).length]});
  return S.sd={room,L,months,dates,rows,done:dn.length,bad,ok:dn.length-bad,nc:L.length-dn.length,byM,probs:ITEMS.map((_,k)=>dn.filter(r=>r.c.items[k]==="bad").length)}}
function sumV(){const d=sumData(),cardS=(n,l,i,c)=>`<div class="card flex items-center gap-3"><span class="ib" style="background:${c};width:44px;height:44px">${ic(i)}</span><div><div class="text-2xl font-bold leading-none">${n}</div><div class="mu text-sm">${l}</div></div></div>`;
  const ap=MENU().slice(1).map(m=>`<button class="ap" onclick="go('${m[0]}')"><span class="ib" style="background:${m[3]}">${ic(m[2])}</span>${m[1].split(" ")[0]}</button>`).join("");
  const lbl=S.sdate==="ALL"?"ทั้งเดือน (ผลล่าสุดของแต่ละคน)":"วันที่ "+thd(S.sdate),ms=d.months.length?d.months:[S.month];
  const mrow=d.months.map((m,i)=>{const[a,b]=d.byM[i];return `<tr><td>${thm(m)}</td><td class="c">${a+b}</td><td class="c"><span class="tag t-ok">${a}</span></td><td class="c"><span class="tag t-bad">${b}</span></td><td class="c">${d.L.length-a-b}</td><td><button class="btn btn-s" onclick="S.month='${m}';S.sdate='ALL';render();scrollTo(0,0)">ดู</button></td></tr>`}).join("");
  return `<div class="mob grid grid-cols-4 gap-3 mb-4 card">${ap}</div>
  <div class="card mb-4"><div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 items-end">${isAdmin()?`<div><label class="lb">ห้อง</label><select class="inp" onchange="S.room=this.value;S.month='';S.sdate='ALL';render()">${rooms().map(r=>`<option ${r===d.room?"selected":""}>${esc(r)}</option>`).join("")}</select></div>`:""}
  <div><label class="lb">เดือน</label><select class="inp" onchange="S.month=this.value;S.sdate='ALL';render()">${ms.map(m=>`<option value="${m}" ${m===S.month?"selected":""}>${thm(m)}</option>`).join("")}</select></div>
  <div><label class="lb">วันที่ตรวจ</label><select class="inp" onchange="S.sdate=this.value;render()"><option value="ALL">ทั้งเดือน (ผลล่าสุดของแต่ละคน)</option>${d.dates.map(x=>`<option value="${x}" ${x===S.sdate?"selected":""}>${thd(x)}</option>`).join("")}</select></div>
  <button class="btn btn-p justify-center" onclick="printIt()">${ic("picture_as_pdf")}พิมพ์ / บันทึก PDF</button></div></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${cardS(d.L.length,"นักเรียนทั้งหมด","groups","#0288D1")}${cardS(d.ok,"เครื่องปกติ","check_circle","#26A69A")}${cardS(d.bad,"เครื่องมีปัญหา","error","#EF5350")}${cardS(d.nc,"ยังไม่ตรวจ","pending","#FFCA28")}</div>
  <div class="card mb-4"><h2 class="font-bold mb-2">ภาพรวมรายเดือน <span class="mu text-sm font-normal">(ผลล่าสุดของแต่ละคนในเดือนนั้น)</span></h2><div class="relative h-64"><canvas id="c3"></canvas></div>
  ${mrow?`<div class="tw mt-3"><table><tr><th>เดือน</th><th class="c">ตรวจแล้ว</th><th class="c">ปกติ</th><th class="c">มีปัญหา</th><th class="c">ยังไม่ตรวจ</th><th></th></tr>${mrow}</table></div>`:""}</div>
  <div class="grid gap-4 lg:grid-cols-2 mb-4"><div class="card"><h2 class="font-bold mb-2">สัดส่วนผลการตรวจ — ${thm(S.month)}</h2><div class="relative h-64"><canvas id="c1"></canvas></div></div><div class="card"><h2 class="font-bold mb-2">ปัญหาที่พบแยกตามรายการ</h2><div class="relative h-64"><canvas id="c2"></canvas></div></div></div>
  <div class="card" id="rep"><div class="pr" style="text-align:center"><h1 style="font-size:20px;font-weight:700">รายงานผลการตรวจเช็คอุปกรณ์แท็บเล็ตเพื่อการศึกษา</h1><div>${esc(S.school)}</div></div>
  <h2 class="font-bold mb-2">ห้อง ${esc(d.room)} — ${thm(S.month)} ${lbl} <span class="tag t-ok">ปกติ ${d.ok}</span> <span class="tag t-bad">มีปัญหา ${d.bad}</span> <span class="tag t-no">ยังไม่ตรวจ ${d.nc}</span></h2>
  <div class="tw"><table><tr><th class="c">ที่</th><th>ชื่อ-สกุล</th><th>Serial No.</th><th>วันที่ตรวจ</th><th class="c">สถานะ</th><th>รายละเอียดปัญหา</th><th class="noprint"></th></tr>${d.rows.map((r,i)=>{const c=r.c,p=c?ITEMS.map((t,k)=>c.items[k]==="bad"?(k+1)+". "+t.replace(/ \(.*\)/,"")+(c.notes[k]?" ("+c.notes[k]+")":""):"").filter(Boolean):[];if(c&&c.result!=="pass"&&c.reason)p.push("สรุป: "+c.reason);
  return `<tr><td class="c">${esc(r.s.no||i+1)}</td><td>${esc(r.s.name)}</td><td>${esc(c?.serial||r.s.sn)||"-"}</td><td>${c?thd(c.date):"-"}</td><td class="c">${tag(c)}</td><td>${p.map(esc).join("<br>")||"-"}${c&&c.photos&&c.photos.length?`<div class="th noprint">${c.photos.map(x=>`<a href="${x.url}" target="_blank"><img loading="lazy" src="${x.url}" alt="หลักฐาน"></a>`).join("")}</div>`:""}</td><td class="noprint whitespace-nowrap"><button class="btn btn-s ${c?"":"btn-p"}" onclick="editC('${r.s.id}','${c?c.date:(S.sdate==="ALL"?today():S.sdate)}')">${ic(c?"edit":"fact_check")}${c?"แก้ไข":"ตรวจ"}</button></td></tr>`}).join("")}</table></div>
  <div class="sig pr"><div>ลงชื่อ ......................................<br>( ${esc(isAdmin()?(S.users.find(u=>u.role==="teacher"&&u.room===d.room)?.name||"......................................"):S.me.name)} )<br>ครูประจำชั้น ${esc(d.room)}</div></div></div>`}
const printIt=()=>{try{window.print()}catch(e){toast("เบราว์เซอร์ไม่อนุญาตให้พิมพ์ในหน้านี้ ลองเปิดลิงก์ในแท็บใหม่","warning")}};
let CH=[];const badge={id:"badge",afterDatasetsDraw(ch){const x=ch.ctx;ch.data.datasets.forEach((ds,di)=>ch.getDatasetMeta(di).data.forEach((el,i)=>{const v=ds.data[i];if(!v)return;const p=el.getCenterPoint(),t=String(v);x.save();x.font="700 13px Sarabun,sans-serif";const w=Math.max(24,x.measureText(t).width+14);x.fillStyle="#4A2C6D";x.beginPath();x.roundRect(p.x-w/2,p.y-11,w,22,11);x.fill();x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.fillText(t,p.x,p.y+1);x.restore()}))}};
function drawCharts(){CH.forEach(c=>c.destroy());CH=[];const d=S.sd;if(!d||!window.Chart)return;const col=getComputedStyle(document.body).color,mk=(id,cfg)=>{const e=$("#"+id);if(e)CH.push(new Chart(e,{...cfg,plugins:[badge]}))};
  const o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:col,font:{family:"Sarabun"}}}}},sc=ix=>({[ix?"x":"y"]:{beginAtZero:true,ticks:{precision:0,color:col},grid:{color:"rgba(128,128,128,.15)"}},[ix?"y":"x"]:{ticks:{color:col},grid:{display:false}}});
  mk("c1",{type:"doughnut",data:{labels:["ปกติ","มีปัญหา","ยังไม่ตรวจ"],datasets:[{data:[d.ok,d.bad,d.nc],backgroundColor:["#26A69A","#EF5350","#FFCA28"],borderWidth:0}]},options:{...o,cutout:"55%"}});
  mk("c2",{type:"bar",data:{labels:SH,datasets:[{label:"จำนวนที่พบปัญหา",data:d.probs,backgroundColor:"#F57B39",borderRadius:8}]},options:{...o,indexAxis:"y",scales:sc(true)}});
  mk("c3",{type:"bar",data:{labels:d.months.map(thm),datasets:[{label:"ปกติ",data:d.byM.map(x=>x[0]),backgroundColor:"#26A69A",borderRadius:8},{label:"มีปัญหา",data:d.byM.map(x=>x[1]),backgroundColor:"#EF5350",borderRadius:8}]},options:{...o,scales:sc(false)}})}
/* ---------- Excel import ---------- */
const loadX=()=>window.XLSX?0:new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";e.onload=ok;e.onerror=()=>no(new Error("โหลดไลบรารี Excel ไม่สำเร็จ"));document.head.appendChild(e)});
let XR=[];
const dlCsv=()=>run(async()=>{if(!dl)return toast("ดาวน์โหลดไม่ได้ในมุมมองนี้","warning");await dl.save({filename:"แบบฟอร์มนำเข้านักเรียน.csv",data:"\ufeffชั้น/ห้อง,เลขที่,ชื่อ-สกุล,เลขเครื่อง (SN)\nป.4/1,1,ด.ช.ตัวอย่าง ใจดี,R9TX0001\n"})});
function openXls(){XR=[];modal("นำเข้านักเรียนจาก Excel",`<p class="mu text-sm">รองรับไฟล์ .xlsx .xls .csv โดยแถวแรกเป็นหัวคอลัมน์ ได้แก่ ชั้น/ห้อง, เลขที่, ชื่อ-สกุล, เลขเครื่อง (SN) ถ้าชั้น/ห้องและเลขที่ตรงกับข้อมูลเดิม ระบบจะอัปเดตทับ</p><input class="inp" type="file" id="xf" accept=".xlsx,.xls,.csv"><div><button class="btn btn-s" onclick="dlCsv()">${ic("download")}ดาวน์โหลดแบบฟอร์มตัวอย่าง</button></div><div id="xp" class="text-sm"></div>`,doImport);$("#xf").onchange=readX}
const readX=e=>run(async()=>{const f=e.target.files[0];if(!f)return;await loadX();
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const g=(r,ks)=>{for(const k of Object.keys(r)){const n=k.toLowerCase().replace(/[\s_\-\/().]/g,"");if(ks.some(x=>n===x||(x.length>2&&n.includes(x))))return String(r[k]).trim()}return""};
  XR=rows.map(r=>({name:g(r,["ชื่อ","name"]),room:g(r,["ชั้น","ห้อง","class","room"]),no:+g(r,["เลขที่","no"])||0,sn:g(r,["sn","serial","เลขเครื่อง"])})).filter(x=>x.name&&x.room);
  $("#xp").innerHTML=XR.length?`<span class="tag t-ok">พบ ${XR.length} รายการ</span> <span class="mu">${XR.slice(0,3).map(x=>esc(x.name)+" ("+esc(x.room)+")").join(", ")}...</span>`:'<span class="tag t-bad">ไม่พบข้อมูล ตรวจสอบหัวคอลัมน์</span>'});
async function doImport(){if(!XR.length)return toast("ยังไม่ได้เลือกไฟล์หรือไม่พบข้อมูล","warning");let i=0;
  for(const x of XR){const ex=S.students.find(s=>s.room===x.room&&(x.no?s.no===x.no:s.name===x.name));await db.collection("students").doc(ex?ex.id:"s"+Date.now()+"_"+(i++)).set({no:x.no,name:x.name,room:x.room,sn:x.sn})}
  const n=XR.length;closeM();toast("นำเข้า "+n+" รายการแล้ว")}
init();
</script></body></html>
